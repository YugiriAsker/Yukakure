<footer class="site-footer">
	<button
		class="site-footer__prompt site-footer__toggle"
		type="button"
		aria-expanded="false"
		aria-controls="site-footer-content"
	>
		<span>
			{{ with site.Params.footer.prompt }}
				{{ . }}
			{{ else }}
				you@your.web:~$
			{{ end }}
		</span>
		<span class="site-footer__cursor" aria-hidden="true">_</span>
		<span class="site-footer__toggle-icon" aria-hidden="true">+</span>
	</button>

	<div class="site-footer__meta" id="site-footer-content" hidden>
		{{ with site.Params.footer.text }}
			{{ . | markdownify }}
		{{ else }}
			your web // hecho con ♥ y <a href="https://gohugo.io/">Hugo</a> // tema <a href="https://github.com/RigleGit/rewired">rewired</a>
		{{ end }}
	</div>
</footer>
