[module]
  [module.hugoVersion]
    extended = false
    min = "0.160.0"

baseURL = "https://yukakure.vercel.app/"
title = "隐于雾中"
theme = "rewired"

defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
[markup.goldmark.renderer]
hardWraps = true

[taxonomies]
tag = "tags"
category = "categories"

[params]
blogPageSize = 5

[params.toc]
enabled = true
ordered = true
startLevel = 1
endLevel = 3

[languages.zh-cn]
label = "简体中文"
locale = "zh-CN"
weight = 1
contentDir = "Yukakure"
title = "Yukakure"

[languages.zh-cn.params]
author = "Yukakure"
descriptionLines = [
  "撕裂有时，缝补有时；静默有时，言语有时；",
  "喜爱有时，恨恶有时；争战有时，和好有时。",
]
tagline = "你好，我是来，这是我的[日常](/posts/)与[猫箱](/projects/)♪︎"

[languages.zh-cn.params.footer]
text = 'Yukakure // 由 [Hugo](https://gohugo.io/) 驱动 // 使用 [Rewired](https://github.com/RigleGit/rewired) 主题'
prompt = "yukakure:~$"

[[languages.zh-cn.menus.main]]
name = "首页"
pageRef = "/"
weight = 10

[[languages.zh-cn.menus.main]]
name = "日常"
pageRef = "/posts"
weight = 20

[[languages.zh-cn.menus.main]]
name = "猫箱"
pageRef = "/projects"
weight = 30

[[languages.zh-cn.menus.main]]
name = "关于"
pageRef = "/about"
weight = 40

#[[languages.zh-cn.menus.main]]
#name = "联系"
#pageRef = "/contact"
#weight = 50

#[[languages.zh-cn.params.social]]
#name = "GitHub"
#url = "https://github.com/YugiriAsker/Yukakure"
#icon = "fa-brands fa-github"

# 子站点：有自己的文档站、实验室或其他项目网站时再启用。
[[languages.zh-cn.params.subnodes]]
name = "Temperance"
url = "https://temperance.vercel.app/"
description = "我在这里写下……"

